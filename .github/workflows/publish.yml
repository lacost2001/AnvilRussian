name: Publish translation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, test and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release.ps1
